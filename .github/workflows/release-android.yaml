name: Release Android

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev, staging, or production"
        required: true
        type: string
      version:
        description: "Release version string"
        required: true
        type: string
      upload_to_play:
        description: "Upload the signed bundle to the matching Play internal track"
        required: false
        type: boolean
        default: false

concurrency:
  group: android-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Resolve environment config
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$ENVIRONMENT" ] || [ -z "$VERSION" ]; then
            echo "::error::Android environment and version are required"
            exit 1
          fi

          case "$ENVIRONMENT" in
            production)
              echo "flavor=Production" >> "$GITHUB_OUTPUT"
              echo "package_id=ai.vocify.vellumassistant" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "flavor=Staging" >> "$GITHUB_OUTPUT"
              echo "package_id=ai.vocify.vellumassistant.staging" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "flavor=Dev" >> "$GITHUB_OUTPUT"
              echo "package_id=ai.vocify.vellumassistant.dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Invalid Android environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Android version must begin with MAJOR.MINOR.PATCH: $VERSION"
            exit 1
          fi
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$(($(date +%s) / 10))" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile --filter=@vellumai/web

      - name: Restore Firebase configuration
        env:
          ANDROID_FIREBASE_CONFIG_B64: ${{ secrets.ANDROID_FIREBASE_CONFIG_B64 }}
          EXPECTED_PACKAGE_ID: ${{ steps.config.outputs.package_id }}
        run: |
          if [ -z "$ANDROID_FIREBASE_CONFIG_B64" ]; then
            echo "::error::ANDROID_FIREBASE_CONFIG_B64 is empty"
            exit 1
          fi
          printf '%s' "$ANDROID_FIREBASE_CONFIG_B64" | base64 --decode > clients/android/app/google-services.json
          if ! jq -e --arg package_id "$EXPECTED_PACKAGE_ID" \
            '.client[]?.client_info.android_client_info.package_name == $package_id' \
            clients/android/app/google-services.json >/dev/null; then
            echo "::error::Firebase configuration does not contain $EXPECTED_PACKAGE_ID"
            exit 1
          fi

      - name: Sync Android project
        working-directory: clients/web
        env:
          VELLUM_ENVIRONMENT: ${{ inputs.environment }}
        run: bun run android:sync

      - name: Restore upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_B64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_B64 is empty"
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > /tmp/vellum-android-upload.jks
          chmod 600 /tmp/vellum-android-upload.jks

      - name: Build signed app bundle
        working-directory: clients/android
        env:
          VELLUM_ANDROID_VERSION_CODE: ${{ steps.config.outputs.version_code }}
          VELLUM_ANDROID_VERSION_NAME: ${{ steps.config.outputs.version_name }}
          VELLUM_ANDROID_REQUIRE_SIGNING: 'true'
          VELLUM_ANDROID_KEYSTORE_PATH: /tmp/vellum-android-upload.jks
          VELLUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VELLUM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VELLUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew ":app:bundle${{ steps.config.outputs.flavor }}Release"

      - name: Upload signed app bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab-${{ inputs.environment }}-${{ steps.config.outputs.version_code }}
          path: clients/android/app/build/outputs/bundle/${{ inputs.environment }}Release/*.aab
          if-no-files-found: error

      - name: Upload to Play internal track
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.config.outputs.package_id }}
          releaseFiles: clients/android/app/build/outputs/bundle/${{ inputs.environment }}Release/*.aab
          track: internal
          status: completed

      - name: Remove signing material
        if: ${{ always() }}
        run: |
          rm -f /tmp/vellum-android-upload.jks
          rm -f clients/android/app/google-services.json
