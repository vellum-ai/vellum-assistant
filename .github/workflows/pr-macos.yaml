name: PR macOS Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'clients/macos/**'
      # The desktop CSP drift guard in packages/electron-desktop reads this file.
      - 'clients/web/index.html'
      - 'packages/electron-utils/**'
      - 'packages/electron-desktop/**'
      # The macOS main process imports this contract's types directly, so a
      # change here can break the macOS type check with no macOS file touched.
      - 'packages/ipc-contract/**'
      - 'packages/native-sidecar/**'
      - 'packages/local-mode/**'
      - 'packages/environments/**'
      - 'packages/avatar-catalog/**'
      - 'packages/avatar-manifest/**'
      - '.github/workflows/pr-macos.yaml'

concurrency:
  group: pr-macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/macos

      - name: Type check
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/macos

      - name: Build (main + preload)
        run: bun run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/macos

      - name: Run tests
        run: bun run test:ci

  native:
    name: Native Notifier (macOS)
    runs-on: macos-26
    defaults:
      run:
        working-directory: clients/macos
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/macos

      - name: Build the notifier addon
        run: bash scripts/build-notifier.sh

      # Installing does not download the Electron binary, and the smoke load
      # below runs under Electron's ABI rather than plain Node's.
      - name: Set up Electron binary
        run: node node_modules/electron/install.js

      - name: Smoke-load the addon under Electron
        run: |
          cat > "$RUNNER_TEMP/smoke-notifier.js" <<'JS'
          const addon = { exports: {} };
          process.dlopen(addon, process.argv[2]);
          for (const name of ["isSupported", "requestAuthorization", "show"]) {
            if (typeof addon.exports[name] !== "function") {
              console.error(`vellum-notifier: missing export ${name}`);
              process.exit(1);
            }
          }
          console.log("vellum-notifier loaded; isSupported =", addon.exports.isSupported());
          process.exit(0);
          JS
          ELECTRON_RUN_AS_NODE=1 ./node_modules/.bin/electron \
            "$RUNNER_TEMP/smoke-notifier.js" \
            "resources/notifier/$(node -p 'process.arch')/vellum-notifier.node"

  checks:
    name: Type Check, Build & Test
    needs: [typecheck, build, test, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          echo "Type Check: $TYPECHECK"
          echo "Build:      $BUILD"
          echo "Test:       $TEST"
          echo "Native:     $NATIVE"
          for r in "$TYPECHECK" "$BUILD" "$TEST" "$NATIVE"; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one macOS CI job failed."
              exit 1
            fi
          done
