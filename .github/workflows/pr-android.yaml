name: PR Android Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'clients/android/**'
      - 'clients/web/capacitor.config.ts'
      - 'clients/web/capacitor-shell/**'
      - 'clients/web/package.json'
      - '.github/actions/setup-android-sdk/**'
      - '.github/workflows/pr-android.yaml'
      - '.github/workflows/ci-main-android.yaml'

concurrency:
  group: pr-android-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Dev Debug
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install web dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile --filter=@vellumai/web

      - name: Sync Android project
        working-directory: clients/web
        env:
          VELLUM_ENVIRONMENT: dev
        run: bun run android:sync

      - name: Build Android app
        working-directory: clients/android
        run: ./gradlew :app:assembleDevDebug
