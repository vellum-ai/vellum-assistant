name: CI Main Service Communication Matrix

# The matrix names files in assistant/, gateway/ and credential-executor/,
# so a change to any of them can add an edge or remove a listed file. This
# runs only the matrix check and test, so it is cheap enough to trigger on
# all three trees.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assistant/**'
      - 'gateway/**'
      - 'credential-executor/**'
      - 'scripts/service-communication/**'
      - 'docs/service-communication-matrix.md'
      - '.github/workflows/ci-main-service-communication-matrix.yaml'

jobs:
  check:
    name: Service Communication Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Check the generated matrix doc is current
        run: bun run scripts/service-communication/generate-matrix.ts --check

      # Runs from scripts/ because the repo-root `bun test` preload refuses
      # root runs.
      - name: Test the matrix against the code
        working-directory: scripts
        run: bun test service-communication/__tests__/generate-matrix.test.ts
