name: PR Windows Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.tool-versions'
      - 'patches/**'
      - 'assistant/**'
      - 'cli/**'
      - 'credential-executor/**'
      - 'gateway/**'
      - 'clients/windows/**'
      - 'clients/web/**'
      - 'clients/macos/src/preload/**'
      - 'meta/feature-flags/**'
      - 'skills/**'
      - 'packages/**'
      - '.github/workflows/pr-windows.yaml'

concurrency:
  group: pr-windows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check (Windows Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/windows --filter=@vellumai/macos

      - name: Type check
        run: bun run typecheck

  build:
    name: Build (Windows Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/windows

      - name: Build (main + preload)
        run: bun run build

  test:
    name: Unit Tests (Windows Electron)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/windows --filter=@vellumai/native-sidecar --filter=@vellumai/macos

      - name: Run tests
        run: bun run test:ci

  native:
    name: Native Helper (Windows)
    runs-on: windows-2025
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: clients/windows/native/global.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/native-sidecar --filter=@vellumai/windows

      - name: Test and publish helper
        run: bun scripts/build-native-helper.ts --arch all --test

  checks:
    name: Type Check, Build & Test (Windows Electron)
    needs: [typecheck, build, test, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          echo "Type Check: $TYPECHECK"
          echo "Build:      $BUILD"
          echo "Test:       $TEST"
          echo "Native:     $NATIVE"
          for r in "$TYPECHECK" "$BUILD" "$TEST" "$NATIVE"; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one windows electron CI job failed."
              exit 1
            fi
          done
