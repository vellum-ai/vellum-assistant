name: PR Gateway Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'gateway/**'
      - 'packages/**'
      - 'meta/feature-flags/**'
      - 'meta/sync-bundled-copies.ts'
      - 'scripts/service-communication/**'
      - 'docs/service-communication-matrix.md'
      - '.github/workflows/pr-gateway.yaml'

concurrency:
  group: pr-gateway-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/vellum-gateway

      - name: Sync feature flag registry
        run: cd .. && bun run meta/sync-bundled-copies.ts

      - name: Lint
        run: bun run lint

      - name: Lint unused code
        run: bun run lint:unused

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      # The matrix records which gateway files call the assistant and which
      # files serve them; a gateway change is where a new edge appears or a
      # listed file disappears. The test runs from scripts/ because the
      # repo-root `bun test` preload refuses root runs.
      - name: Check service communication matrix is regenerated
        working-directory: .
        run: bun run scripts/service-communication/generate-matrix.ts --check

      - name: Test service communication matrix
        working-directory: scripts
        run: bun test service-communication/__tests__/generate-matrix.test.ts
