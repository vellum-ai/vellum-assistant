name: Build Windows release artifacts

# Build, sign, and verify Windows installers for one environment.
# Callers publish the artifacts through publish-windows.yaml after release gates pass.
# Never dispatched on its own.
#
# External gates (repository secrets can be shared across environments):
#   signing: secrets.AZURE_TENANT_ID, secrets.AZURE_CLIENT_ID, secrets.AZURE_CLIENT_SECRET
#   production observability: secrets.SENTRY_DSN_WINDOWS (main process and
#             the renderer's VITE_SENTRY_DSN_WINDOWS), secrets.SENTRY_AUTH_TOKEN,
#             vars.SENTRY_PROJECT_WINDOWS
#   optional: vars.WINDOWS_SIGNING_TIMESTAMP_URL

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev, staging, or production"
        required: true
        type: string
      version:
        description: "Release version string (e.g. 0.6.0, 0.6.1-staging.1)"
        required: true
        type: string

concurrency:
  group: windows-build-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    outputs:
      sentry_upload: ${{ steps.gates.outputs.sentry_upload }}
    steps:
      - name: Validate inputs and signing gate
        id: gates
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_SENTRY: ${{ secrets.SENTRY_DSN_WINDOWS != '' && secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_PROJECT_WINDOWS != '' }}
        run: |
          case "$ENVIRONMENT" in
            dev|staging|production) ;;
            *) echo "::error::environment must be dev, staging, or production (got '$ENVIRONMENT')"; exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not a release version"; exit 1
          fi
          if [ "$HAS_AZURE" != "true" ]; then
            echo "::error::Windows signing needs AZURE_TENANT_ID, AZURE_CLIENT_ID, and AZURE_CLIENT_SECRET secrets at repository scope or on the $ENVIRONMENT environment. Unsigned Windows releases are never published."
            exit 1
          fi
          if [ "$ENVIRONMENT" = "production" ] && [ "$HAS_SENTRY" != "true" ]; then
            echo "::error::Production Windows releases need SENTRY_DSN_WINDOWS and SENTRY_AUTH_TOKEN secrets plus the SENTRY_PROJECT_WINDOWS variable"
            exit 1
          fi
          if [ "$HAS_SENTRY" != "true" ]; then
            echo "::warning::Windows Sentry reporting and renderer source-map upload are disabled for $ENVIRONMENT"
          fi
          echo "sentry_upload=$HAS_SENTRY" >> "$GITHUB_OUTPUT"

  build:
    name: Build native payload (Windows ${{ matrix.arch }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    # The arm64 runner is a preview image; only dev tolerates it failing.
    continue-on-error: ${{ matrix.arch == 'arm64' && inputs.environment == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-vs2026-arm
    defaults:
      run:
        working-directory: clients/windows
    env:
      ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
      VELLUM_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - &bun-cache
        name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: windows-bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            windows-bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: clients/windows/native/global.json

      # Kept out of the job env: dotnet also honors MSBUILD_EXE_PATH and
      # would resolve SDKs through the Visual Studio MSBuild.
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "image-version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Integrate vcpkg with MSBuild
        run: vcpkg integrate install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before build:runtime: the app and every service compiled into the CLI
      # runtime report the release version.
      - name: Stamp release version into package.json
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for pkg in package.json ../../assistant/package.json ../../gateway/package.json ../../cli/package.json ../../credential-executor/package.json; do
            jq --arg v "$VERSION" '.version = $v' "$pkg" > "${pkg}.tmp" && mv "${pkg}.tmp" "$pkg"
          done

      - name: Build native helper
        run: bun scripts/build-native-helper.ts --arch ${{ matrix.arch }}

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          $binaryCache = Join-Path $env:RUNNER_TEMP "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg tools and binary archives
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            clients/windows/.build-tools/vcpkg
            !clients/windows/.build-tools/vcpkg/*/buildtrees
            !clients/windows/.build-tools/vcpkg/*/packages
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: windows-vcpkg-v1-${{ runner.os }}-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.arch }}-${{ steps.msbuild.outputs.image-version }}-${{ hashFiles('clients/windows/native/Vellum.PreviewHandler/vcpkg.json', 'clients/windows/scripts/build-preview-handler.ts') }}

      - name: Build preview handler
        env:
          MSBUILD_EXE_PATH: ${{ steps.msbuild.outputs.path }}
        run: bun scripts/build-preview-handler.ts --arch ${{ matrix.arch }}

      - name: Build packaged runtime
        env:
          VITE_PLATFORM_MODE: "false"
          # The renderer picks VITE_SENTRY_DSN_WINDOWS on a Windows host; the
          # web DSN covers the SPA the bundled runtime serves to browsers.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_DSN_WINDOWS: ${{ secrets.SENTRY_DSN_WINDOWS }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SESSION_REPLAY_APP_ID: ${{ vars.VITE_SESSION_REPLAY_APP_ID }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ inputs.version }}
          SENTRY_UPLOAD_SOURCE_MAPS: ${{ needs.preflight.outputs.sentry_upload }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WINDOWS }}
          # A source-map upload failure degrades to a warning instead of
          # failing the release build (see clients/web/vite.config.ts).
          SENTRY_ALLOW_UPLOAD_FAILURE: "true"
        run: bun run build:runtime

      - name: Archive native payload
        shell: bash
        run: |
          tar -cf native-build.tar \
            package.json \
            resources/cli-runtime \
            "resources/native-helper/$ELECTRON_TARGET_ARCH" \
            native/Vellum.PreviewHandler/build/*/Release/Vellum.PreviewHandler.dll \
            native/Vellum.PreviewHandler/build/*/Release/registration.json

      - name: Upload native payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-${{ matrix.arch }}
          path: clients/windows/native-build.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  package-and-sign:
    name: Package and sign (Windows ${{ matrix.arch }})
    needs: [build]
    # Azure Artifact Signing does not support Windows ARM runners.
    runs-on: windows-2025
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    continue-on-error: ${{ matrix.arch == 'arm64' && inputs.environment == 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: clients/windows
    env:
      ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
      VELLUM_ENVIRONMENT: ${{ inputs.environment }}
      WINDOWS_SIGNING_PUBLISHER_NAME: Vocify Inc.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - *bun-cache

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/windows

      - name: Download native payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-native-${{ matrix.arch }}
          path: clients/windows

      - name: Restore native payload and release version
        shell: bash
        run: tar -xf native-build.tar

      - name: Package and sign NSIS installer
        env:
          SENTRY_DSN_WINDOWS: ${{ secrets.SENTRY_DSN_WINDOWS }}
          WINDOWS_SIGNING_PROVIDER: azure-trusted-signing
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: https://cus.codesigning.azure.net/
          AZURE_TRUSTED_SIGNING_ACCOUNT: vellum-assistant
          AZURE_TRUSTED_SIGNING_PROFILE: vellum-assistant
        run: bunx electron-builder --win --config electron-builder.config.cjs --publish never

      - name: Verify signatures
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Arch $env:ELECTRON_TARGET_ARCH -PublisherName $env:WINDOWS_SIGNING_PUBLISHER_NAME

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ matrix.arch }}
          path: |
            clients/windows/dist/*.exe
            clients/windows/dist/*.exe.blockmap
            clients/windows/dist/latest.yml
            clients/windows/dist/signing-manifest-*.json
          if-no-files-found: error
          retention-days: 7
