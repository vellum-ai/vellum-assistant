name: CI Main CLI Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'cli/**'
      - 'packages/local-mode/**'
      - 'packages/environments/**'
      - 'packages/service-contracts/**'
      - 'meta/bin/vellum.js'
      - 'meta/package.json'
      - 'scripts/strip-bundled-field-from-tarball.mjs'
      - 'scripts/test-cli-package-install.ts'
      - '.github/workflows/ci-main-cli.yaml'

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    # The suite normally finishes in ~1 minute; without a cap, a hung
    # `bun test` occupies a runner for GitHub's 6-hour default.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/cli

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Compile check
        run: bun run compile:check

      - name: Test with coverage
        run: bun test --coverage

  arm64-package-install:
    name: Linux ARM64 Voice Package Install
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/cli

      - name: Test live voice
        run: >-
          bun test
          src/__tests__/guardian-session-auth.test.ts
          src/__tests__/platform-client.test.ts
          src/__tests__/live-voice-platform-auth.test.ts
          src/__tests__/live-voice-pipewire-audio.test.ts
          src/__tests__/live-voice-connection.test.ts
          src/__tests__/live-voice-channel-client.test.ts
          src/__tests__/live-voice-session.test.ts
          src/__tests__/voice.test.ts

      - name: Type check
        run: bun run typecheck

      - name: Compile check
        run: bun run compile:check

      - name: Verify installed package
        run: bun ../scripts/test-cli-package-install.ts

  pack-cli:
    name: Pack CLI Tarball
    needs: [checks, arm64-package-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/cli

      - name: Stamp dev version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          echo "Stamping dev version: $DEV_VERSION"
          jq --arg v "$DEV_VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Strip bundled deps from the manifest
        run: bun ../scripts/strip-bundled-deps.mjs .
      - name: Pack CLI tarball
        run: |
          bun pm pack
          TARBALL=$(ls vellumai-cli-*.tgz)
          bun ../scripts/strip-bundled-field-from-tarball.mjs "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"
        id: pack

      - name: Upload CLI tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-tarball
          path: cli/${{ steps.pack.outputs.tarball }}
          retention-days: 7

  notify-cli:
    name: Slack Notification (CLI)
    needs: [checks, arm64-package-install]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get Slack ID
        id: slack-id
        run: |
          GITHUB_USER="${{ github.actor }}"
          CHECKS_RESULT="${{ needs.checks.result }}"
          ARM64_RESULT="${{ needs.arm64-package-install.result }}"

          if [[ "$CHECKS_RESULT" == "failure" || "$ARM64_RESULT" == "failure" ]]; then
            STATUS="failure"
          elif [[ "$CHECKS_RESULT" == "cancelled" || "$ARM64_RESULT" == "cancelled" ]]; then
            STATUS="cancelled"
          elif [[ "$CHECKS_RESULT" == "skipped" || "$ARM64_RESULT" == "skipped" ]]; then
            STATUS="skipped"
          else
            STATUS="success"
          fi

          SLACK_ID=$(yq ".github_to_slack_all_notifications.[\"$GITHUB_USER\"]" .github/config/github_slack_mapping.yaml)

          if [ "$SLACK_ID" = "null" ]; then
            case $STATUS in
              failure)
                SLACK_ID=$(yq ".github_to_slack_failure_notifications.[\"$GITHUB_USER\"]" .github/config/github_slack_mapping.yaml)
                ;;
              success)
                SLACK_ID=$(yq ".github_to_slack_success_notifications.[\"$GITHUB_USER\"]" .github/config/github_slack_mapping.yaml)
                ;;
              cancelled)
                SLACK_ID=$(yq ".github_to_slack_cancelled_notifications.[\"$GITHUB_USER\"]" .github/config/github_slack_mapping.yaml)
                ;;
            esac
          fi

          if [ "$SLACK_ID" = "null" ]; then
            SLACK_ID="$GITHUB_USER"
          fi

          if [ "$STATUS" = "cancelled" ] || [ "$SLACK_ID" = "$GITHUB_USER" ]; then
            echo "should_tag=false" >> $GITHUB_OUTPUT
          else
            echo "should_tag=true" >> $GITHUB_OUTPUT
          fi
          echo "id=$SLACK_ID" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/send-build-alert
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ steps.slack-id.outputs.status }}
          slack-user-id: ${{ steps.slack-id.outputs.id }}
          should-tag: ${{ steps.slack-id.outputs.should_tag }}
          channel: "#build-alerts"
