name: PR Docs Checks

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'clients/docs/**'
      - 'packages/design-library/**'
      - '.github/workflows/pr-docs.yaml'

concurrency:
  group: pr-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Independent jobs run in parallel, same structure as pr-web.yaml.
jobs:
  lint:
    name: 'Docs: Lint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/docs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/docs

      - name: Lint
        run: bun run lint

  typecheck:
    name: 'Docs: Type Check'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/docs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/docs

      - name: Type check
        run: bun run typecheck

  test:
    name: 'Docs: Test'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/docs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/docs

      - name: Test
        run: bun run test

  build:
    name: 'Docs: Build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/docs
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@vellumai/docs

      - name: Build
        run: bun run build

  # Aggregator: single stable status check name for branch protection.
  checks:
    name: 'Docs: Lint, Type Check & Build'
    needs: [lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "Lint:       $LINT"
          echo "Type Check: $TYPECHECK"
          echo "Test:       $TEST"
          echo "Build:      $BUILD"
          for r in "$LINT" "$TYPECHECK" "$TEST" "$BUILD"; do
            if [ "$r" != "success" ]; then
              echo "::error::At least one docs CI job failed."
              exit 1
            fi
          done
