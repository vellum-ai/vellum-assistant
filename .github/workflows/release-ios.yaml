name: Release iOS

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment: dev, staging, or production"
        required: true
        type: string
      version:
        description: "Release version string (e.g. 0.6.0, 0.6.1-staging.1)"
        required: true
        type: string
      notify_slack:
        description: "Whether the reusable workflow sends its own Slack alert. Set false when the caller already summarizes iOS status."
        required: false
        type: boolean
        default: true

concurrency:
  group: ios-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    env:
      KEYCHAIN_NAME: ios-build.keychain
      KEYCHAIN_PASSWORD: temporary-ci-password
    steps:
      - name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$ENVIRONMENT" ] || [ -z "$VERSION" ]; then
            echo "::error::Missing required inputs: environment=$ENVIRONMENT, version=$VERSION"
            exit 1
          fi
          if [[ "$ENVIRONMENT" != "dev" && "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "production" ]]; then
            echo "::error::Invalid environment: $ENVIRONMENT (expected dev, staging, or production)"
            exit 1
          fi
          echo "Building iOS $ENVIRONMENT release, version $VERSION"

      # Every environment resolves four bundle IDs and four provisioning
      # profiles: the app's, the VoiceActivity extension, the Share extension,
      # and the NotificationService extension. The profile names must match
      # character for character both the Apple Developer portal and the
      # `PROVISIONING_PROFILE_SPECIFIER_Manual` values in
      # `clients/ios/App/App/Config/*.xcconfig`. See "Signing: four profiles per
      # environment" in `clients/ios/README.md`.
      - name: Resolve environment config
        id: config
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            production)
              echo "scheme=App" >> "$GITHUB_OUTPUT"
              echo "bundle_id=ai.vocify-inc.vellum-assistant-ios" >> "$GITHUB_OUTPUT"
              echo "app_group=group.ai.vocify-inc.vellum-assistant-ios" >> "$GITHUB_OUTPUT"
              echo "profile_key=IOS_PROVISIONING_PROFILE" >> "$GITHUB_OUTPUT"
              echo "profile_name=Vellum Assistant iOS Distribution" >> "$GITHUB_OUTPUT"
              echo "ext_bundle_id=ai.vocify-inc.vellum-assistant-ios.VoiceActivity" >> "$GITHUB_OUTPUT"
              echo "ext_profile_key=IOS_PROVISIONING_PROFILE_EXT" >> "$GITHUB_OUTPUT"
              echo "ext_profile_name=Vellum Assistant iOS VoiceActivity Distribution" >> "$GITHUB_OUTPUT"
              echo "share_bundle_id=ai.vocify-inc.vellum-assistant-ios.Share" >> "$GITHUB_OUTPUT"
              echo "share_profile_key=IOS_PROVISIONING_PROFILE_SHARE" >> "$GITHUB_OUTPUT"
              echo "share_profile_name=Vellum Assistant iOS Share Distribution" >> "$GITHUB_OUTPUT"
              echo "nse_bundle_id=ai.vocify-inc.vellum-assistant-ios.NotificationService" >> "$GITHUB_OUTPUT"
              echo "nse_profile_key=IOS_PROVISIONING_PROFILE_NSE" >> "$GITHUB_OUTPUT"
              echo "nse_profile_name=Vellum Assistant iOS NotificationService Distribution" >> "$GITHUB_OUTPUT"
              echo "apple_app_id_key=APPLE_APP_ID_PROD" >> "$GITHUB_OUTPUT"
              echo "vellum_env=production" >> "$GITHUB_OUTPUT"
              echo "testflight_internal=false" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "scheme=App Staging" >> "$GITHUB_OUTPUT"
              echo "bundle_id=ai.vocify-inc.vellum-assistant-ios.staging" >> "$GITHUB_OUTPUT"
              echo "app_group=group.ai.vocify-inc.vellum-assistant-ios.staging" >> "$GITHUB_OUTPUT"
              echo "profile_key=IOS_PROVISIONING_PROFILE_STAGING" >> "$GITHUB_OUTPUT"
              echo "profile_name=Vellum Assistant iOS Staging Distribution" >> "$GITHUB_OUTPUT"
              echo "ext_bundle_id=ai.vocify-inc.vellum-assistant-ios.staging.VoiceActivity" >> "$GITHUB_OUTPUT"
              echo "ext_profile_key=IOS_PROVISIONING_PROFILE_EXT_STAGING" >> "$GITHUB_OUTPUT"
              echo "ext_profile_name=Vellum Assistant iOS Staging VoiceActivity Distribution" >> "$GITHUB_OUTPUT"
              echo "share_bundle_id=ai.vocify-inc.vellum-assistant-ios.staging.Share" >> "$GITHUB_OUTPUT"
              echo "share_profile_key=IOS_PROVISIONING_PROFILE_SHARE_STAGING" >> "$GITHUB_OUTPUT"
              echo "share_profile_name=Vellum Assistant iOS Staging Share Distribution" >> "$GITHUB_OUTPUT"
              echo "nse_bundle_id=ai.vocify-inc.vellum-assistant-ios.staging.NotificationService" >> "$GITHUB_OUTPUT"
              echo "nse_profile_key=IOS_PROVISIONING_PROFILE_NSE_STAGING" >> "$GITHUB_OUTPUT"
              echo "nse_profile_name=Vellum Assistant iOS Staging NotificationService Distribution" >> "$GITHUB_OUTPUT"
              echo "apple_app_id_key=APPLE_APP_ID_STAGING" >> "$GITHUB_OUTPUT"
              echo "vellum_env=staging" >> "$GITHUB_OUTPUT"
              echo "testflight_internal=true" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "scheme=App Dev" >> "$GITHUB_OUTPUT"
              echo "bundle_id=ai.vocify-inc.vellum-assistant-ios.dev" >> "$GITHUB_OUTPUT"
              echo "app_group=group.ai.vocify-inc.vellum-assistant-ios.dev" >> "$GITHUB_OUTPUT"
              echo "profile_key=IOS_PROVISIONING_PROFILE_DEV" >> "$GITHUB_OUTPUT"
              echo "profile_name=Vellum Assistant iOS Dev Distribution" >> "$GITHUB_OUTPUT"
              echo "ext_bundle_id=ai.vocify-inc.vellum-assistant-ios.dev.VoiceActivity" >> "$GITHUB_OUTPUT"
              echo "ext_profile_key=IOS_PROVISIONING_PROFILE_EXT_DEV" >> "$GITHUB_OUTPUT"
              echo "ext_profile_name=Vellum Assistant iOS Dev VoiceActivity Distribution" >> "$GITHUB_OUTPUT"
              echo "share_bundle_id=ai.vocify-inc.vellum-assistant-ios.dev.Share" >> "$GITHUB_OUTPUT"
              echo "share_profile_key=IOS_PROVISIONING_PROFILE_SHARE_DEV" >> "$GITHUB_OUTPUT"
              echo "share_profile_name=Vellum Assistant iOS Dev Share Distribution" >> "$GITHUB_OUTPUT"
              echo "nse_bundle_id=ai.vocify-inc.vellum-assistant-ios.dev.NotificationService" >> "$GITHUB_OUTPUT"
              echo "nse_profile_key=IOS_PROVISIONING_PROFILE_NSE_DEV" >> "$GITHUB_OUTPUT"
              echo "nse_profile_name=Vellum Assistant iOS Dev NotificationService Distribution" >> "$GITHUB_OUTPUT"
              echo "apple_app_id_key=APPLE_APP_ID_DEV" >> "$GITHUB_OUTPUT"
              echo "vellum_env=dev" >> "$GITHUB_OUTPUT"
              echo "testflight_internal=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: clients/web
        run: bun install --frozen-lockfile --filter=@vellumai/web

      - name: Capacitor sync
        working-directory: clients/web
        env:
          VELLUM_ENVIRONMENT: ${{ steps.config.outputs.vellum_env }}
          # No Sentry DSN here: this build bundles no web assets. The iOS app
          # runs the deployed web SPA via `server.url`, so native webview DSNs
          # are baked into the SPA bundle by the web-SPA deploy workflow and
          # selected at runtime.
        run: bunx cap sync ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/App
        run: xcodegen generate --spec project.yml

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Import code-signing certificate
        env:
          CERT_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [ -z "$CERT_P12" ]; then
            echo "::error::DIST_CERTIFICATE_P12 is empty. Export the Apple Distribution certificate as a .p12, encode it with 'base64 -i <file>', and set the secret."
            exit 1
          fi
          # Without this the decode writes an empty or truncated file and
          # 'security import' fails on the file rather than on the secret,
          # which sends the operator to the keychain for a fault that is in
          # the secret.
          if ! echo "$CERT_P12" | base64 -D > /tmp/ios-certificate.p12; then
            echo "::error::DIST_CERTIFICATE_P12 is not valid base64. Re-encode the .p12 with 'base64 -i <file>' and replace the secret."
            exit 1
          fi
          security import /tmp/ios-certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm /tmp/ios-certificate.p12

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning | grep -q "Apple Distribution" \
            || { echo "::error::Apple Distribution identity not found in keychain."; exit 1; }

      - name: Install provisioning profiles
        id: profiles
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PROVISIONING_PROFILE_STAGING: ${{ secrets.IOS_PROVISIONING_PROFILE_STAGING }}
          IOS_PROVISIONING_PROFILE_DEV: ${{ secrets.IOS_PROVISIONING_PROFILE_DEV }}
          IOS_PROVISIONING_PROFILE_EXT: ${{ secrets.IOS_PROVISIONING_PROFILE_EXT }}
          IOS_PROVISIONING_PROFILE_EXT_STAGING: ${{ secrets.IOS_PROVISIONING_PROFILE_EXT_STAGING }}
          IOS_PROVISIONING_PROFILE_EXT_DEV: ${{ secrets.IOS_PROVISIONING_PROFILE_EXT_DEV }}
          IOS_PROVISIONING_PROFILE_SHARE: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE }}
          IOS_PROVISIONING_PROFILE_SHARE_STAGING: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_STAGING }}
          IOS_PROVISIONING_PROFILE_SHARE_DEV: ${{ secrets.IOS_PROVISIONING_PROFILE_SHARE_DEV }}
          IOS_PROVISIONING_PROFILE_NSE: ${{ secrets.IOS_PROVISIONING_PROFILE_NSE }}
          IOS_PROVISIONING_PROFILE_NSE_STAGING: ${{ secrets.IOS_PROVISIONING_PROFILE_NSE_STAGING }}
          IOS_PROVISIONING_PROFILE_NSE_DEV: ${{ secrets.IOS_PROVISIONING_PROFILE_NSE_DEV }}
        run: |
          set -o pipefail

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # The filenames must differ: a second write to the same name
          # silently clobbers the first, and the failure surfaces much later
          # as an opaque export error.
          #
          # Returns non-zero when the secret is empty, leaving how fatal that
          # is to the caller. A secret that is present but not base64 is a
          # different fault with a different fix, so it exits here rather than
          # returning the "empty" status a caller may choose to tolerate.
          install_profile() {
            local key="$1" filename="$2"
            local b64="${!key}"
            if [ -z "$b64" ]; then
              return 1
            fi
            if ! echo "$b64" | base64 -D > "$PROFILE_DIR/$filename"; then
              echo "::error::Provisioning profile secret $key is not valid base64. Re-encode the downloaded .mobileprovision with 'base64 -i <file>' and replace the secret."
              exit 1
            fi
            echo "Provisioning profile installed from $key"
          }

          # Decodes an installed profile into a plist for the checks below.
          #
          # Decoding and checking are separate steps on purpose: a profile that
          # is not CMS-signed at all (a mis-encoded secret, a truncated
          # download) fails the decode, and folding that into an entitlement
          # test would report a missing capability and send the operator to the
          # portal for a fault that is in the secret.
          decode_profile() {
            local filename="$1" plist="$2" secret="$3"
            if ! security cms -D -i "$PROFILE_DIR/$filename" > "$plist"; then
              echo "::error::Could not decode the profile installed from $secret with 'security cms -D'. The secret does not hold a CMS-signed .mobileprovision: re-download the profile from the Apple Developer portal, re-encode it with 'base64 -i <file>', and replace $secret."
              exit 1
            fi
          }

          # Fails the run when the profile does not grant $key as true. The
          # plist is read by key path rather than grepped, so the check is
          # anchored to Entitlements and asserts the value.
          require_entitlement_true() {
            local plist="$1" key="$2" remedy="$3"
            local granted
            granted=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:$key" "$plist" 2>/dev/null || true)
            if [ "$granted" != "true" ]; then
              echo "::error::$remedy"
              exit 1
            fi
          }

          # Fails the run when the profile carries no $key at all. An
          # entitlement whose value is an array has no "true" to compare
          # against, so presence is the whole of the assertion.
          require_entitlement_present() {
            local plist="$1" key="$2" remedy="$3"
            if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:$key" "$plist" > /dev/null 2>&1; then
              echo "::error::$remedy"
              exit 1
            fi
          }

          # The App Group this environment's bundles name, restated from
          # clients/ios/App/App/Config/App*.xcconfig and pinned to them by
          # clients/ios/scripts/__tests__/notification-service-bundle-ids.test.ts.
          APP_GROUP="${{ steps.config.outputs.app_group }}"

          # Every signed bundle declares the App Group: the app through
          # App/App.entitlements and App/App-Dev.entitlements, all three
          # appexes through App/Extension.entitlements. A profile issued before
          # the group was assigned to its App ID does not grant it, and the
          # build fails at Archive with an error that names neither the
          # entitlement nor the fix.
          #
          # The array has to carry this environment's group specifically. An
          # empty array satisfies presence and grants nothing, and the
          # production group is a prefix of the staging and dev ones, so a
          # profile issued against the wrong environment's App ID passes any
          # check looser than a whole-line match.
          require_app_group() {
            local plist="$1" secret="$2" target="$3"
            require_entitlement_present "$plist" com.apple.security.application-groups \
              "Provisioning profile $secret does not grant com.apple.security.application-groups, which $target declares. Archive would fail while signing $target. Fix: 'Manual Apple Developer portal setup' in clients/ios/README.md for this environment's row: assign $APP_GROUP to this App ID (steps 1 and 2), reissue its distribution profile under the identical name (steps 3 and 4), then replace $secret."
            if ! /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:com.apple.security.application-groups" "$plist" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | grep -qxF "$APP_GROUP"; then
              echo "::error::Provisioning profile $secret grants com.apple.security.application-groups but not $APP_GROUP, which $target declares. Archive would fail while signing $target. Fix: 'Manual Apple Developer portal setup' in clients/ios/README.md for this environment's row: assign $APP_GROUP to this App ID (steps 1 and 2), reissue its distribution profile under the identical name (steps 3 and 4), then replace $secret."
              exit 1
            fi
          }

          # The app profile is non-negotiable: without it there is no build to
          # attempt, and no later step could produce a more useful error.
          APP_PROFILE_KEY="${{ steps.config.outputs.profile_key }}"
          if ! install_profile "$APP_PROFILE_KEY" ios_distribution.mobileprovision; then
            echo "::error::Provisioning profile secret $APP_PROFILE_KEY is empty"
            exit 1
          fi

          # The app entitlements declare
          # com.apple.developer.usernotifications.communication, and a profile
          # issued before Communication Notifications was enabled on the App ID
          # does not grant it. Xcode only notices at Archive, long after the
          # build has started, with an error that names neither the entitlement
          # nor the fix, so the profile is decoded and checked here instead.
          # The appexes carry no entitlement of their own beyond the App Group,
          # so the communication check belongs to the app profile alone.
          APP_PLIST="$RUNNER_TEMP/app_profile.plist"
          decode_profile ios_distribution.mobileprovision "$APP_PLIST" "$APP_PROFILE_KEY"
          require_entitlement_true "$APP_PLIST" \
            com.apple.developer.usernotifications.communication \
            "Provisioning profile $APP_PROFILE_KEY does not grant com.apple.developer.usernotifications.communication, which App.entitlements and App-Dev.entitlements declare. Archive would fail while signing the app target. Fix: 'Manual Apple Developer portal setup' in clients/ios/README.md, steps 2 and 4 for this environment's app row: tick Communication Notifications on the app App ID, reissue its distribution profile under the identical name, then replace $APP_PROFILE_KEY."
          require_app_group "$APP_PLIST" "$APP_PROFILE_KEY" "the app target"

          # A missing extension profile is tolerated: the App IDs and profiles
          # behind IOS_PROVISIONING_PROFILE_EXT* do not exist in the Apple
          # Developer portal yet. The archive fails either way, so exiting here
          # would only replace Xcode's precise, target-named signing error with
          # an opaque one — and it would do so on releases whose only fault is
          # sharing a workflow with the extension.
          EXT_PROFILE_KEY="${{ steps.config.outputs.ext_profile_key }}"
          if install_profile "$EXT_PROFILE_KEY" ios_distribution_ext.mobileprovision; then
            echo "ext_profile_installed=true" >> "$GITHUB_OUTPUT"
            EXT_PLIST="$RUNNER_TEMP/ext_profile.plist"
            decode_profile ios_distribution_ext.mobileprovision "$EXT_PLIST" "$EXT_PROFILE_KEY"
            require_app_group "$EXT_PLIST" "$EXT_PROFILE_KEY" "the VoiceActivity extension"
          else
            echo "ext_profile_installed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Provisioning profile secret $EXT_PROFILE_KEY is empty, so the VoiceActivity extension profile was not installed and is omitted from ExportOptions.plist. THIS RELEASE WILL STILL FAIL: every app target embeds the extension, so 'xcodebuild archive' stops at signing with \"No profile for team ... matching '${{ steps.config.outputs.ext_profile_name }}' found ... (in target 'VoiceActivity ...')\". No iOS release of any environment can be produced until the portal setup lands. Fix: follow 'Manual Apple Developer portal setup' in clients/ios/README.md to create the App ID and profile, then add $EXT_PROFILE_KEY."
          fi

          SHARE_PROFILE_KEY="${{ steps.config.outputs.share_profile_key }}"
          if install_profile "$SHARE_PROFILE_KEY" ios_distribution_share.mobileprovision; then
            echo "share_profile_installed=true" >> "$GITHUB_OUTPUT"
            SHARE_PLIST="$RUNNER_TEMP/share_profile.plist"
            decode_profile ios_distribution_share.mobileprovision "$SHARE_PLIST" "$SHARE_PROFILE_KEY"
            require_app_group "$SHARE_PLIST" "$SHARE_PROFILE_KEY" "the Share extension"
          else
            echo "share_profile_installed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Provisioning profile secret $SHARE_PROFILE_KEY is empty, so the Share extension profile was not installed and is omitted from ExportOptions.plist. THIS RELEASE WILL STILL FAIL: every app target embeds the extension, so 'xcodebuild archive' stops at signing with \"No profile for team ... matching '${{ steps.config.outputs.share_profile_name }}' found ... (in target 'Share ...')\". No iOS release of any environment can be produced until the portal setup lands. Fix: follow 'Manual Apple Developer portal setup' in clients/ios/README.md to create the App ID and profile, then add $SHARE_PROFILE_KEY."
          fi

          NSE_PROFILE_KEY="${{ steps.config.outputs.nse_profile_key }}"
          if install_profile "$NSE_PROFILE_KEY" ios_distribution_nse.mobileprovision; then
            echo "nse_profile_installed=true" >> "$GITHUB_OUTPUT"
            NSE_PLIST="$RUNNER_TEMP/nse_profile.plist"
            decode_profile ios_distribution_nse.mobileprovision "$NSE_PLIST" "$NSE_PROFILE_KEY"
            require_app_group "$NSE_PLIST" "$NSE_PROFILE_KEY" "the NotificationService extension"
          else
            echo "nse_profile_installed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Provisioning profile secret $NSE_PROFILE_KEY is empty, so the NotificationService extension profile was not installed and is omitted from ExportOptions.plist. THIS RELEASE WILL STILL FAIL: every app target embeds the extension, so 'xcodebuild archive' stops at signing with \"No profile for team ... matching '${{ steps.config.outputs.nse_profile_name }}' found ... (in target 'NotificationService ...')\". No iOS release of any environment can be produced until the portal setup lands. Fix: follow 'Manual Apple Developer portal setup' in clients/ios/README.md to create the App ID and profile, then add $NSE_PROFILE_KEY."
          fi

      - name: Set version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Apple requires CFBundleShortVersionString to be exactly X.Y.Z
          # (numeric only, no prerelease suffixes). Strip any suffix for all
          # environments. The full version is logged for traceability.
          # https://developer.apple.com/documentation/bundleresources/information-property-list/cfbundleshortversionstring
          DISPLAY_VERSION=$(echo "$VERSION" | sed 's/-.*//')
          BUILD_VERSION=$(date -u +%Y%m%d%H%M)
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Display version: $DISPLAY_VERSION (from $VERSION) / Build version: $BUILD_VERSION"

      # `provisioningProfiles` needs one entry per signed bundle, not just the
      # app: `-exportArchive` fails when an embedded extension has no entry,
      # and its error does not name the offending extension. It fails just as
      # hard on an entry naming a profile that was never installed, so the
      # extension entry follows the install step's outcome rather than
      # re-testing the secret here — the two decisions have to agree.
      - name: Generate ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          PROFILE_NAME: ${{ steps.config.outputs.profile_name }}
          EXT_BUNDLE_ID: ${{ steps.config.outputs.ext_bundle_id }}
          EXT_PROFILE_NAME: ${{ steps.config.outputs.ext_profile_name }}
          EXT_PROFILE_INSTALLED: ${{ steps.profiles.outputs.ext_profile_installed }}
          SHARE_BUNDLE_ID: ${{ steps.config.outputs.share_bundle_id }}
          SHARE_PROFILE_NAME: ${{ steps.config.outputs.share_profile_name }}
          SHARE_PROFILE_INSTALLED: ${{ steps.profiles.outputs.share_profile_installed }}
          NSE_BUNDLE_ID: ${{ steps.config.outputs.nse_bundle_id }}
          NSE_PROFILE_NAME: ${{ steps.config.outputs.nse_profile_name }}
          NSE_PROFILE_INSTALLED: ${{ steps.profiles.outputs.nse_profile_installed }}
          TESTFLIGHT_INTERNAL: ${{ steps.config.outputs.testflight_internal }}
        run: |
          EXT_ENTRY=""
          if [ "$EXT_PROFILE_INSTALLED" = "true" ]; then
            EXT_ENTRY="<key>$EXT_BUNDLE_ID</key>
                  <string>$EXT_PROFILE_NAME</string>"
          fi
          SHARE_ENTRY=""
          if [ "$SHARE_PROFILE_INSTALLED" = "true" ]; then
            SHARE_ENTRY="<key>$SHARE_BUNDLE_ID</key>
                  <string>$SHARE_PROFILE_NAME</string>"
          fi
          NSE_ENTRY=""
          if [ "$NSE_PROFILE_INSTALLED" = "true" ]; then
            NSE_ENTRY="<key>$NSE_BUNDLE_ID</key>
                  <string>$NSE_PROFILE_NAME</string>"
          fi

          INTERNAL_ENTRY=""
          if [ "$TESTFLIGHT_INTERNAL" = "true" ]; then
            INTERNAL_ENTRY="    <key>testFlightInternalTestingOnly</key>
              <true/>"
          fi
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
                  $EXT_ENTRY
                  $SHARE_ENTRY
                  $NSE_ENTRY
              </dict>
              $INTERNAL_ENTRY
          </dict>
          </plist>
          EOF

      # PROVISIONING_PROFILE_SPECIFIER is deliberately NOT passed here. An
      # xcodebuild CLI override applies to every target in the archive, so a
      # single specifier would push the app profile onto an embedded
      # VoiceActivity, Share or NotificationService appex, which it does not
      # cover. The per-target mapping lives in
      # `clients/ios/App/App/Config/*.xcconfig` instead, next to the per-target
      # bundle IDs it has to agree with. Those xcconfigs key the
      # specifier off CODE_SIGN_STYLE, so the `CODE_SIGN_STYLE=Manual`
      # override below is what activates it — local Xcode builds stay on
      # automatic signing and pick up no specifier at all.
      - name: Archive
        working-directory: clients/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "${{ steps.config.outputs.scheme }}" \
            -archivePath /tmp/App.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ steps.version.outputs.display_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_version }}"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportPath /tmp/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_APP_ID_DEV: ${{ secrets.APPLE_APP_ID_DEV }}
          APPLE_APP_ID_STAGING: ${{ secrets.APPLE_APP_ID_STAGING }}
          APPLE_APP_ID_PROD: ${{ secrets.APPLE_APP_ID_PROD }}
          BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

          APPLE_APP_ID_KEY="${{ steps.config.outputs.apple_app_id_key }}"
          APPLE_APP_ID="${!APPLE_APP_ID_KEY}"
          if [ -z "$APPLE_APP_ID" ]; then
            echo "::error::Apple App ID secret $APPLE_APP_ID_KEY is empty"
            exit 1
          fi

          IPA_FILE=$(find /tmp/export -name "*.ipa" -maxdepth 1 | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error::No .ipa file found in /tmp/export"
            exit 1
          fi

          # `altool` exits 0 even when it fails. It prints "VERIFY FAILED" or
          # "UPLOAD FAILED", reports the reason, and returns success anyway, so
          # `bash -e` never trips and the step goes green having shipped
          # nothing. Every dev release between the VoiceActivity appex landing
          # (#39306) and #39556 was green while uploading nothing at all: the
          # appex was missing CFBundleDisplayName and App Store Connect
          # rejected all of them.
          #
          # So the exit code is not the signal. `--output-format json` makes
          # altool emit a `product-errors` array, which is, and it is a
          # documented contract rather than a message string that can be
          # reworded. The raw JSON is echoed so the log keeps the detail that
          # the human-readable output used to carry.
          #
          # The text scan afterwards is a backstop for the case this exists to
          # prevent: a failure altool reports in some shape that is neither a
          # non-zero exit nor a `product-errors` entry. Between the three, a
          # release that does not reach TestFlight cannot report success.
          run_altool() {
            local label="$1"
            shift

            local output status
            set +e
            output=$(xcrun altool "$@" --output-format json)
            status=$?
            set -e

            printf '%s\n' "$output"

            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed (altool exited $status)"
              exit 1
            fi

            # Unparseable output is not proof of failure, and failing on it
            # would block releases on a formatting change, so that case falls
            # through to the text scan below instead. Both probes are one-line
            # programs on purpose: a `run: |` block scalar ends at the first
            # line indented less than the block, so an indentation-sensitive
            # heredoc cannot live here.
            if printf '%s' "$output" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
              local errors
              errors=$(printf '%s' "$output" | python3 -c 'import json,sys; print("\n".join(str(e.get("message","unknown error")) for e in (json.load(sys.stdin).get("product-errors") or [])))')
              if [ -n "$errors" ]; then
                while IFS= read -r message; do
                  echo "::error::$label: $message"
                done <<< "$errors"
                exit 1
              fi
            else
              echo "::warning::altool output was not valid JSON; relying on the text scan"
            fi

            if printf '%s' "$output" | grep -qE 'VERIFY FAILED|UPLOAD FAILED|Failed to (validate|upload)'; then
              echo "::error::$label reported a failure in its output"
              exit 1
            fi
          }

          echo "Validating $IPA_FILE..."
          run_altool "Validation" --validate-app \
            -f "$IPA_FILE" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          echo "Uploading $IPA_FILE to TestFlight..."
          run_altool "Upload" --upload-package "$IPA_FILE" \
            --type ios \
            --apple-id "$APPLE_APP_ID" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "$BUILD_VERSION" \
            --bundle-short-version-string "$DISPLAY_VERSION" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: /tmp/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keychain and keys
        if: always()
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -rf ~/.private_keys 2>/dev/null || true

  notify-slack:
    needs: [build-and-upload]
    if: always() && inputs.notify_slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions/send-build-alert
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/send-build-alert
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ needs.build-and-upload.result }}
          slack-user-id: ${{ github.actor }}
          should-tag: 'false'
