name: CI/CD Main iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'clients/ios/**'
      # Source of the committed avatar app icons, so a catalog change with no
      # regeneration still has to trip the drift check.
      - 'assistant/src/avatar/**'
      # The Android launcher XMLs embed the quirky eye geometry; the drift
      # test in scripts/__tests__ pins them to the avatar library.
      - 'clients/android/app/src/main/res/**'
      - 'clients/web/capacitor.config.ts'
      - 'clients/web/package.json'
      - '.github/workflows/ci-main-ios.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # Same build as `pr-ios.yaml`, re-run after merge: both are path-filtered,
    # so two PRs that pass independently can still land a broken `main`.
    # Change the two together.
    #
    # Runner and Xcode match `release-ios.yaml` so this check exercises the
    # same toolchain that produces TestFlight builds.
    runs-on: macos-15
    # The unsigned Xcode build is what needs the room here; the avatar icon
    # drift check rasterizes 54 icons in seconds. A `macos-15` runner is slow
    # and variable enough that a tighter budget fails on time alone.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: clients/web
        # `@vellumai/assistant` is here for the avatar icon drift check below:
        # rasterizing the icons needs its native `@resvg/resvg-js` binding.
        run: |
          bun install --frozen-lockfile \
            --filter=@vellumai/web \
            --filter=@vellumai/assistant

      - name: Check avatar icon drift
        working-directory: clients/ios
        # Asserts the committed icon sets and xcconfig still match a fresh
        # generation. Runs from `clients/ios` because the repo-root
        # `test-preload.ts` rejects a root `bun test`.
        run: bun test scripts/__tests__/

      - name: Capacitor sync
        working-directory: clients/web
        env:
          # `capacitor.config.ts` derives `server.url` and the Xcode scheme
          # name from this, so it has to agree with the scheme built below.
          VELLUM_ENVIRONMENT: dev
        run: bunx cap sync ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: clients/ios/App
        run: xcodegen generate --spec project.yml

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build (unsigned)
        working-directory: clients/ios/App
        # Unsigned so the check needs no repository secrets. Signing and
        # TestFlight upload stay in `release-ios.yaml`.
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme "App Dev" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
