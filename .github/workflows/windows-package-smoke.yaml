name: Windows Package Smoke

on:
  workflow_call: {}

jobs:
  package:
    name: Package (Windows ${{ matrix.arch }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: clients/windows
    env:
      ELECTRON_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: clients/windows/native/global.json

      # Kept out of the job env: dotnet also honors MSBUILD_EXE_PATH and
      # would resolve SDKs through the Visual Studio MSBuild.
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Integrate vcpkg with MSBuild
        run: vcpkg integrate install

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native helper
        run: bun scripts/build-native-helper.ts --arch ${{ matrix.arch }}

      - name: Build preview handler
        env:
          MSBUILD_EXE_PATH: ${{ steps.msbuild.outputs.path }}
        run: bun scripts/build-preview-handler.ts --arch ${{ matrix.arch }}

      - name: Build packaged runtime
        run: bun run build:runtime

      - name: Build main and preload
        run: bun run build

      - name: Package NSIS installer
        run: bunx electron-builder --win --config electron-builder.config.cjs --publish never

      - name: Install, launch, and uninstall smoke (x64)
        if: matrix.arch == 'x64'
        run: bun scripts/package-smoke.ts --arch x64

      - name: Upload arm64 installer
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64-package
          path: clients/windows/dist/*-arm64.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload signing manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signing-manifest-${{ matrix.arch }}
          path: clients/windows/dist/signing-manifest-*.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Collect app logs after failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-logs | Out-Null
          Get-ChildItem "$env:APPDATA" -File -Recurse -Filter 'vellum.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force -ErrorAction SilentlyContinue $_.FullName "smoke-logs\$($_.Directory.Name)-vellum.log" }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-logs-${{ matrix.arch }}
          path: clients/windows/smoke-logs
          if-no-files-found: ignore
          retention-days: 3

  launch-arm64:
    name: Launch Smoke (Windows arm64)
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/windows
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Download arm64 installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-arm64-package
          path: clients/windows/dist

      - name: Install, launch, and uninstall smoke (arm64)
        run: bun scripts/package-smoke.ts --arch arm64

      - name: Collect app logs after failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-logs | Out-Null
          Get-ChildItem "$env:APPDATA" -Directory -Filter 'Vellum*' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$($_.FullName)\logs" "smoke-logs\$($_.Name)" }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke-logs-arm64-launch
          path: clients/windows/smoke-logs
          if-no-files-found: ignore
          retention-days: 3
