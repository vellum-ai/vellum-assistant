name: OpenRouter Rate Sync

# OpenRouter publishes machine-readable prices and moves them on its own
# schedule. This job follows them once a day and opens a PR with whatever
# moved, so a reprice never lands on whoever pushes next.
#
# Entries the sync refuses to change on its own get a long-lived issue, since
# a job summary disappears with the run that wrote it.
on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: openrouter-rate-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync OpenRouter rates
    if: github.repository == 'vellum-ai/vellum-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VELLUM_AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.VELLUM_AUTOMATION_GITHUB_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        working-directory: assistant
        run: bun install --frozen-lockfile --filter=@vellumai/assistant --filter=@vellumai/vellum-gateway

      - name: Sync rates and open a PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "vellum-automation[bot]"
          git config user.email "192048195+vellum-automation[bot]@users.noreply.github.com"

          # One long-lived branch, so repeated repricing accumulates on a
          # single PR instead of opening a new one every morning. Merge main
          # in rather than rebasing, so an in-review PR keeps its history.
          BRANCH="automation/openrouter-rates"
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH" origin/main
          fi

          cd assistant
          bun run sync:openrouter-rates | tee /tmp/rate-report.txt
          bun run sync:llm-catalog
          cd ..

          # Always surface the report, including the entries the script
          # deliberately refuses to apply on its own.
          {
            echo '## OpenRouter rate sync'
            echo
            if [ -s /tmp/rate-report.txt ]; then
              echo '```'
              cat /tmp/rate-report.txt
              echo '```'
            else
              echo 'No drift. Catalog rates match the live card.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Findings the sync will not apply need somewhere durable to
          # live. The issue body is rewritten each run, so it always reflects
          # the current state rather than accumulating daily comments.
          ISSUE_TITLE="OpenRouter catalog: entries needing a human"
          EXISTING_ISSUE=$(gh issue list --state open --search "in:title OpenRouter catalog entries needing" \
            --json number,title --jq ".[] | select(.title==\"$ISSUE_TITLE\") | .number" | head -1)

          if grep -q '^Needs a human:' /tmp/rate-report.txt; then
            FINDINGS=$(sed -n '/^Needs a human:/,$p' /tmp/rate-report.txt)
            ISSUE_BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
              'The OpenRouter rate sync found catalog entries it will not change on its own, because each one is a judgement call rather than a number swap.' \
              "$FINDINGS" \
              'Opened by .github/workflows/openrouter-rate-sync.yaml, and rewritten on each run. Close it once the entries are resolved.')
            if [ -n "$EXISTING_ISSUE" ]; then
              gh issue edit "$EXISTING_ISSUE" --body "$ISSUE_BODY"
              echo "Updated issue #${EXISTING_ISSUE}"
            else
              gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
            fi
          elif [ -n "$EXISTING_ISSUE" ]; then
            gh issue close "$EXISTING_ISSUE" \
              --comment "The live card no longer reports anything needing a human here."
          fi

          if git diff --quiet; then
            echo "No rate changes to commit."
            exit 0
          fi

          git add assistant/src/providers/model-catalog.ts meta/llm-provider-catalog.json
          git commit --no-verify -m "chore(openrouter): follow live OpenRouter rates" \
            -m "$(cat /tmp/rate-report.txt)"
          git push --no-verify origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" --body "$(printf 'Another reprice landed on this branch.\n\n```\n%s\n```\n' "$(cat /tmp/rate-report.txt)")"
            echo "Pushed to existing PR #${EXISTING_PR}"
            exit 0
          fi

          BODY=$(printf '%s\n\n```\n%s\n```\n\n%s\n' \
            'OpenRouter moved the rates below on its published card. These are cost-estimate inputs only: OpenRouter users are billed by OpenRouter on their own key, so the effect here is that a number shown in usage stops being stale.' \
            "$(cat /tmp/rate-report.txt)" \
            'Opened by .github/workflows/openrouter-rate-sync.yaml. Anything under "Needs a human" was found but deliberately not applied, and is tracked in its own issue.')

          gh pr create \
            --title "chore(openrouter): follow live OpenRouter rates" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
