name: CI/CD Main Android

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'patches/**'
      - 'clients/android/**'
      - 'clients/web/capacitor.config.ts'
      - 'clients/web/capacitor-shell/**'
      - 'clients/web/package.json'
      - '.github/actions/setup-android-sdk/**'
      - '.github/workflows/android-checks.yaml'
      - '.github/workflows/ci-main-android.yaml'
      - '.github/workflows/release-android.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-checks.yaml
