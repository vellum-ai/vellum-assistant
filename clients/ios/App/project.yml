# XcodeGen spec for the Capacitor iOS app.
#
# Source of truth for the Xcode project structure. The generated
# `App.xcodeproj/project.pbxproj` is gitignored and recreated by CI on
# every build via `xcodegen generate`. This avoids committing a
# Capacitor-generated pbxproj whose objectVersion drifts out of sync
# with the Xcode toolchain on CI runners.
#
# References:
#   - XcodeGen spec: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
#   - Capacitor SPM:  https://capacitorjs.com/docs/ios/spm

name: App

options:
  deploymentTarget:
    # Do not lower: Live Activities need 16.1, interactive Live Activity
    # content 17.0, the Action Button 17.1. Keep in sync with
    # IPHONEOS_DEPLOYMENT_TARGET in `App/Config/Base.xcconfig`, which wins
    # for targets carrying an xcconfig; this covers those that don't.
    iOS: "17.0"
  developmentLanguage: en
  defaultConfig: Release
  groupSortPosition: top
  minimumXcodeGenVersion: "2.42.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

# Project-level base xcconfig. Only Debug uses one (matches the original
# Capacitor-generated project — Release inherits XcodeGen's defaults).
configFiles:
  Debug: ../debug.xcconfig

# Local Swift package containing Capacitor and its plugins. Capacitor's
# `cap sync` regenerates `CapApp-SPM/Package.swift` based on installed
# `@capacitor/*` plugins.
packages:
  CapApp-SPM:
    path: CapApp-SPM

targetTemplates:
  AppEnvironment:
    type: application
    platform: iOS
    sources:
      # Shared Swift sources, storyboards, assets, and entitlements.
      # The three `AppIcon-*.icon` directories are excluded here; each
      # target re-adds the single icon it ships with so that
      # ASSETCATALOG_COMPILER_APPICON_NAME (set per-target via xcconfig)
      # resolves to a bundled resource.
      - path: App
        excludes:
          - "Info.plist"
          - "App.entitlements"
          - "Config/**"
          - "AppIcon.icon"
          - "AppIcon-Dev.icon"
          - "AppIcon-Staging.icon"
          - "capacitor.config.json"
          - "config.xml"
          - "public"
      # Capacitor-managed resources. These are produced by `bunx cap
      # sync ios` and gitignored, so they may not exist when xcodegen
      # runs locally before the first sync. `optional: true` lets
      # xcodegen reference them without verifying existence at
      # generation time; CI runs `cap sync` after `xcodegen generate`,
      # so they exist by archive time.
      - path: App/capacitor.config.json
        optional: true
        buildPhase: resources
      - path: App/config.xml
        optional: true
        buildPhase: resources
      - path: App/public
        optional: true
        type: folder
        buildPhase: resources
    settings:
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: '$(inherited) "-DDEBUG"'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
    # Auto-generate one scheme per target. The whole `App.xcodeproj/`
    # tree is gitignored — schemes, pbxproj, contents.xcworkspacedata,
    # everything inside the bundle is a build-time artifact regenerated
    # by `xcodegen generate`.
    scheme:
      configVariants: []
    # Anchored so `ExtensionEnvironment` can alias the identical guard
    # instead of carrying a second copy that could drift.
    preBuildScripts: &projectSpecFreshnessGuard
      # Fails the Xcode build with a clear, actionable error if the
      # generated project is older than the source-of-truth spec
      # (`clients/ios/App/project.yml`). This catches the case where a
      # local dev pulls a project.yml change but forgets to run
      # `bun run ios:setup` (or `xcodegen generate`) before building.
      # CI never trips this guard because the workflow runs
      # `xcodegen generate` immediately before `xcodebuild archive`.
      - name: Verify project.yml is in sync with App.xcodeproj
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          spec="$SRCROOT/project.yml"
          pbxproj="$PROJECT_FILE_PATH/project.pbxproj"
          if [ ! -f "$spec" ] || [ ! -f "$pbxproj" ]; then
            exit 0
          fi
          if [ "$spec" -nt "$pbxproj" ]; then
            echo "error: clients/ios/App/project.yml is newer than App.xcodeproj." >&2
            echo "error: Run 'bun run ios:setup' from clients/web/ to regenerate the Xcode project." >&2
            exit 1
          fi

  # WidgetKit extension hosting the live-voice Live Activity. One per
  # environment, so each app embeds an extension whose bundle ID is
  # prefixed by its own — iOS requires that, and it is why there are
  # three of these rather than one shared appex.
  ExtensionEnvironment:
    type: app-extension
    platform: iOS
    sources:
      - path: VoiceActivity
        excludes:
          - "Info.plist"
      # `App/Shared` holds everything both sides need, from one copy on
      # disk rather than duplicated files whose halves drift apart: the
      # ActivityKit wire model, the URL-scheme and color helpers, and —
      # because a Control Center control is code in the appex — the deep
      # link plus the App Intent that control invokes. The app targets
      # already sweep the same directory up via `AppEnvironment`'s `App`
      # source path.
      - path: App/Shared
    settings:
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: '$(inherited) "-DDEBUG"'
          # VOICE_ACTIVITY_EXTENSION marks "this is the appex" for the
          # `App/Shared` sources compiled into both sides.
          # `VoiceModeDeepLink.route()` uses it to compile its
          # `UIApplication`/`AppDelegate` body — extension-unsafe API the
          # appex never reaches — out of the extension binary.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG VOICE_ACTIVITY_EXTENSION
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: VOICE_ACTIVITY_EXTENSION
    # No `scheme:` — extensions build as embedded dependencies of the app
    # targets, so the three app schemes are the only ones worth having.
    preBuildScripts: *projectSpecFreshnessGuard

targets:
  App:
    templates: [AppEnvironment]
    sources:
      - path: App/AppIcon.icon
    configFiles:
      Debug: App/Config/App.xcconfig
      Release: App/Config/App.xcconfig
    dependencies:
      - target: VoiceActivity
        embed: true

  "App Staging":
    templates: [AppEnvironment]
    sources:
      - path: App/AppIcon-Staging.icon
    configFiles:
      Debug: App/Config/App-Staging.xcconfig
      Release: App/Config/App-Staging.xcconfig
    dependencies:
      - target: "VoiceActivity Staging"
        embed: true

  "App Dev":
    templates: [AppEnvironment]
    sources:
      - path: App/AppIcon-Dev.icon
    configFiles:
      Debug: App/Config/App-Dev.xcconfig
      Release: App/Config/App-Dev.xcconfig
    dependencies:
      - target: "VoiceActivity Dev"
        embed: true

  VoiceActivity:
    templates: [ExtensionEnvironment]
    configFiles:
      Debug: App/Config/Extension.xcconfig
      Release: App/Config/Extension.xcconfig

  "VoiceActivity Staging":
    templates: [ExtensionEnvironment]
    configFiles:
      Debug: App/Config/Extension-Staging.xcconfig
      Release: App/Config/Extension-Staging.xcconfig

  "VoiceActivity Dev":
    templates: [ExtensionEnvironment]
    configFiles:
      Debug: App/Config/Extension-Dev.xcconfig
      Release: App/Config/Extension-Dev.xcconfig
